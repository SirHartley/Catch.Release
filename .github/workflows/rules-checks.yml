name: Rules checks

# Runs RulesCheck and DialogueCheck (docs/RULES.md, docs/DIALOGUE.md) whenever rules.csv, the lore
# excerpts, the rules tools or their vanilla data change.
on:
  pull_request:
    paths:
      - data/campaign/rules.csv
      - data/config/settings.json
      - docs/LORE.md
      - docs/rules-reference/vanilla-rules-index.txt
      - docs/rules-reference/vanilla-pacing-baseline.txt
      - jars/src/**
      - .github/workflows/rules-checks.yml
  push:
    branches: [master]
    paths:
      - data/campaign/rules.csv
      - data/config/settings.json
      - docs/LORE.md
      - docs/rules-reference/vanilla-rules-index.txt
      - docs/rules-reference/vanilla-pacing-baseline.txt
      - jars/src/**
      - .github/workflows/rules-checks.yml

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # CLAUDE.md "Building" dependencies. The library jars come from lib/; LWJGL, org.json and log4j from Maven
      # Central. lw_Console.jar is not available here, so the Console Commands classes are left out.
      - name: Collect compile dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/deps"
          cd "$RUNNER_TEMP/deps"
          cp "$GITHUB_WORKSPACE/lib/starfarer.api.jar" .
          unzip -j -q "$GITHUB_WORKSPACE/lib/GraphicsLib.zip" GraphicsLib/jars/Graphics.jar
          unzip -j -q "$GITHUB_WORKSPACE/lib/Lazylib_lunalib.zip" LazyLib/jars/LazyLib.jar LunaLib/jars/LunaLib.jar
          unzip -j -q "$GITHUB_WORKSPACE/lib/MagicLib.zip" MagicLib/jars/MagicLib.jar
          maven=https://repo1.maven.org/maven2
          curl -fsSLO "$maven/org/lwjgl/lwjgl/lwjgl/2.9.3/lwjgl-2.9.3.jar"
          curl -fsSLO "$maven/org/lwjgl/lwjgl/lwjgl_util/2.9.3/lwjgl_util-2.9.3.jar"
          curl -fsSLO "$maven/org/json/json/20140107/json-20140107.jar"
          curl -fsSLO "$maven/log4j/log4j/1.2.17/log4j-1.2.17.jar"
          echo "DEPS=$(ls "$RUNNER_TEMP"/deps/*.jar | tr '\n' ':')" >> "$GITHUB_ENV"

      - name: Compile
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          find jars/src -name '*.java' -not -path 'jars/src/catchrelease/commands/*' > "$RUNNER_TEMP/sources.txt"
          javac --release 17 -encoding UTF-8 -nowarn -cp "$DEPS" -d "$RUNNER_TEMP/out" "@$RUNNER_TEMP/sources.txt"

      - name: Rules check
        run: java -cp "$RUNNER_TEMP/out:$DEPS" catchrelease.tools.rules.RulesCheck .

      - name: Dialogue check, changed rows
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:data/campaign/rules.csv" > "$RUNNER_TEMP/base_rules.csv"
          java -cp "$RUNNER_TEMP/out" catchrelease.tools.rules.DialogueCheck . --changed "$RUNNER_TEMP/base_rules.csv"

      - name: Dialogue check, whole file
        run: java -cp "$RUNNER_TEMP/out" catchrelease.tools.rules.DialogueCheck .
